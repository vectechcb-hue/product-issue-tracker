<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="產品議題履歷"><link rel="manifest" href="./manifest.webmanifest"><title>產品討論議題履歷表</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,'Noto Sans TC',sans-serif;background:#f3f4f6}.safe{padding-bottom:env(safe-area-inset-bottom)}input,select,button{font-size:16px}@media(max-width:640px){.desktop-table{display:none}.mobile-card{display:block}.top-actions{display:grid;grid-template-columns:1fr 1fr}.top-actions button{justify-content:center}.form-grid{grid-template-columns:1fr}.modal-box{max-height:92vh}.container-x{padding-left:12px;padding-right:12px}}@media(min-width:641px){.mobile-card{display:none}}.toast{animation:in .2s ease}@keyframes in{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}</style>
</head><body class="text-gray-800 min-h-screen safe">
<div id="toast" class="fixed bottom-5 left-3 right-3 sm:left-auto sm:right-5 z-[100] flex flex-col gap-2"></div>
<header class="bg-white border-b sticky top-0 z-30"><div class="max-w-7xl mx-auto container-x py-3 flex items-center justify-between gap-3"><div><h1 class="text-xl sm:text-2xl font-bold"><i class="fa-solid fa-list-check text-blue-600 mr-1"></i>產品討論議題履歷表</h1><p class="text-xs text-gray-500">雲端同步・Excel 匯入/匯出・手機 PWA</p></div><button id="configBtn" class="text-gray-600 bg-gray-100 rounded-lg px-3 py-2" title="資料庫設定"><i class="fa-solid fa-gear"></i></button></div></header>
<main class="max-w-7xl mx-auto container-x py-4 sm:py-6">
<section class="bg-white rounded-xl shadow-sm border p-4 mb-5"><div class="flex justify-between items-center mb-3"><h2 class="font-bold"><i class="fa-solid fa-plus text-blue-500 mr-1"></i>新增議題</h2><span id="connection" class="text-xs text-gray-500">連線中...</span></div><form id="issueForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
<div><label class="text-xs font-medium">提出日期</label><input id="date" type="date" required class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">專案/產品名稱</label><input id="product" required placeholder="如：產品A" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">議題類別</label><select id="category" class="w-full border rounded-lg px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div>
<div><label class="text-xs font-medium">負責人員</label><input id="assignee" required class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div class="md:col-span-4"><label class="text-xs font-medium">議題說明</label><input id="description" required class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div class="md:col-span-2"><label class="text-xs font-medium">處理對策與進度</label><input id="action" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">預計完成日期</label><input id="targetDate" type="date" class="w-full border rounded-lg px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">狀態</label><select id="status" class="w-full border rounded-lg px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div>
<div class="md:col-span-3"><label class="text-xs font-medium">備註</label><input id="remarks" class="w-full border rounded-lg px-3 py-2 mt-1"></div><div class="flex items-end"><button class="w-full bg-blue-600 text-white rounded-lg px-4 py-2 font-medium"><i class="fa-solid fa-plus mr-1"></i>新增</button></div>
</form></section>
<section class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="p-4 border-b flex flex-col sm:flex-row gap-3 justify-between"><div class="font-bold">議題紀錄 <span id="count" class="text-xs text-gray-500"></span></div><div class="top-actions flex flex-wrap gap-2"><button id="passwordBtn" class="bg-purple-600 text-white rounded-lg px-3 py-2"><i class="fa-solid fa-key mr-1"></i>修改密碼</button><input id="file" type="file" accept=".xlsx,.xls" hidden><button id="importBtn" class="bg-gray-100 rounded-lg px-3 py-2"><i class="fa-solid fa-file-import mr-1"></i>匯入 Excel</button><button id="exportBtn" class="bg-green-600 text-white rounded-lg px-3 py-2"><i class="fa-solid fa-file-excel mr-1"></i>匯出 Excel</button></div></div>
<div class="desktop-table overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr id="head"></tr></thead><tbody id="table"></tbody></table></div><div id="cards" class="mobile-card p-3 space-y-3"></div></section></main>
<div id="editModal" class="fixed inset-0 bg-black/50 hidden z-50 p-3 flex items-center justify-center"><div class="modal-box bg-white rounded-xl shadow-xl w-full max-w-4xl overflow-y-auto p-5"><div class="flex justify-between border-b pb-3 mb-4"><h2 class="font-bold text-lg">編輯議題</h2><button onclick="closeEdit()"><i class="fa-solid fa-xmark text-xl"></i></button></div><form id="editForm" class="grid grid-cols-1 md:grid-cols-4 gap-3"></form></div></div>
<div id="passModal" class="fixed inset-0 bg-black/50 hidden z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-xl w-full max-w-sm p-5"><h2 class="font-bold mb-3">請輸入編輯密碼</h2><input id="pass" type="password" class="w-full border rounded-lg px-3 py-2" placeholder="輸入密碼"><div class="flex gap-2 justify-end mt-4"><button onclick="closePass()" class="bg-gray-100 px-4 py-2 rounded-lg">取消</button><button onclick="verifyPass()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">確認</button></div></div></div>
<div id="changeModal" class="fixed inset-0 bg-black/50 hidden z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-xl w-full max-w-sm p-5"><h2 class="font-bold mb-3">修改編輯密碼</h2><input id="oldPass" type="password" placeholder="目前密碼" class="w-full border rounded-lg px-3 py-2 mb-2"><input id="newPass" type="password" placeholder="新密碼（至少3字元）" class="w-full border rounded-lg px-3 py-2 mb-2"><input id="newPass2" type="password" placeholder="確認新密碼" class="w-full border rounded-lg px-3 py-2"><div class="flex gap-2 justify-end mt-4"><button onclick="closeChange()" class="bg-gray-100 px-4 py-2 rounded-lg">取消</button><button onclick="changePassword()" class="bg-purple-600 text-white px-4 py-2 rounded-lg">確認修改</button></div></div></div>
<div id="configModal" class="fixed inset-0 bg-black/50 hidden z-50 p-4 flex items-center justify-center"><div class="bg-white rounded-xl w-full max-w-lg p-5"><h2 class="font-bold text-lg mb-2">Firebase 資料庫設定</h2><p class="text-xs text-gray-500 mb-3">GitHub Pages 不會自動提供原本平台的 Firebase 設定。請貼上 Firebase Web App 的設定 JSON；設定只儲存在此瀏覽器。</p><textarea id="firebaseInput" rows="9" class="w-full border rounded-lg p-3 text-sm font-mono" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea><input id="appIdInput" class="w-full border rounded-lg px-3 py-2 mt-2" placeholder="App ID（可維持 product-issue-tracker-01）"><div class="flex gap-2 justify-end mt-4"><button onclick="closeConfig()" class="bg-gray-100 px-4 py-2 rounded-lg">取消</button><button onclick="saveConfig()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">儲存並連線</button></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';import{getAuth,signInAnonymously}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';import{getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,writeBatch,updateDoc,setDoc}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const H={id:'序號',date:'提出日期',product:'專案/產品名稱',category:'議題類別',description:'議題說明',assignee:'負責人員',action:'處理對策與進度',targetDate:'預計完成日期',status:'狀態',remarks:'備註'};const keys=Object.keys(H);let db,auth,issues=[],password='admin',pending=null,unsub=null;
const $=id=>document.getElementById(id),today=()=>{let d=new Date();return d.toISOString().slice(0,10)};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(t,err=false){let e=document.createElement('div');e.className='toast '+(err?'bg-red-600':'bg-green-600')+' text-white rounded-lg px-4 py-3 shadow-lg';e.textContent=t;$('toast').appendChild(e);setTimeout(()=>e.remove(),2800)}
function cfg(){try{return JSON.parse(localStorage.getItem('firebaseConfig')||'{}')}catch{return{}}}function appid(){return localStorage.getItem('firebaseAppId')||'product-issue-tracker-01'}
async function init(){let c=cfg();if(!c.apiKey){$('connection').textContent='尚未設定 Firebase';openConfig();return}try{let a=initializeApp(c);auth=getAuth(a);db=getFirestore(a);await signInAnonymously(auth);$('connection').textContent='● 雲端已連線';listen()}catch(e){console.error(e);$('connection').textContent='連線失敗';toast('Firebase 初始化失敗，請檢查設定',true)}}
function listen(){if(unsub)unsub();let base=['artifacts',appid(),'public','data'];unsub=onSnapshot(collection(db,...base,'issues'),s=>{issues=s.docs.map(d=>({dbId:d.id,...d.data()}));issues.sort((a,b)=>(parseInt(a.id)||0)-(parseInt(b.id)||0));render()});onSnapshot(doc(db,...base,'config','settings'),s=>{if(s.exists()&&s.data().editPassword)password=s.data().editPassword})}
function render(){ $('count').textContent=`（${issues.length} 筆）`; $('head').innerHTML=keys.map(k=>`<th class="px-4 py-3 text-left whitespace-nowrap">${H[k]}</th>`).join('')+'<th class="px-4 py-3">操作</th>';if(!issues.length){$('table').innerHTML='<tr><td colspan="11" class="p-8 text-center text-gray-500">目前尚無議題紀錄</td></tr>';$('cards').innerHTML='<div class="text-center text-gray-500 py-8">目前尚無議題紀錄</div>';return}$('table').innerHTML=issues.map(row=>`<tr class="border-t hover:bg-gray-50">${keys.map(k=>`<td class="px-4 py-3 whitespace-nowrap">${esc(row[k])}</td>`).join('')}<td class="px-4 py-3 whitespace-nowrap"><button class="text-blue-600 mr-3" onclick="window.edit('${row.dbId}')"><i class="fa-solid fa-pen"></i></button><button class="text-red-600" onclick="window.del('${row.dbId}')"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');$('cards').innerHTML=issues.map(r=>`<article class="border rounded-xl p-4 shadow-sm bg-white"><div class="flex justify-between gap-2"><div><div class="font-bold text-lg">#${esc(r.id)} ${esc(r.product)}</div><div class="text-xs text-gray-500">${esc(r.date)} ・ ${esc(r.category)} ・ ${esc(r.assignee)}</div></div><span class="px-2 py-1 rounded-full text-xs ${r.status==='已結案'?'bg-green-100 text-green-700':r.status==='處理中'?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}">${esc(r.status)}</span></div><div class="mt-3 space-y-2 text-sm"><p><b>議題：</b>${esc(r.description)}</p><p><b>進度：</b>${esc(r.action)}</p><p><b>預計：</b>${esc(r.targetDate)}</p><p><b>備註：</b>${esc(r.remarks)}</p></div><div class="border-t mt-3 pt-3 flex justify-end gap-4"><button class="text-blue-600" onclick="window.edit('${r.dbId}')">編輯</button><button class="text-red-600" onclick="window.del('${r.dbId}')">刪除</button></div></article>`).join('')}
$('issueForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return toast('資料庫未連線',true);let max=issues.reduce((m,x)=>Math.max(m,parseInt(x.id)||0),0);let r={id:String(max+1),date:$('date').value,product:$('product').value,category:$('category').value,description:$('description').value,assignee:$('assignee').value,action:$('action').value,targetDate:$('targetDate').value,status:$('status').value,remarks:$('remarks').value,timestamp:Date.now()};try{await addDoc(collection(db,'artifacts',appid(),'public','data','issues'),r);e.target.reset();$('date').value=today();toast('新增成功')}catch(x){toast('新增失敗',true)}});
window.del=async id=>{if(!db)return;try{await deleteDoc(doc(db,'artifacts',appid(),'public','data','issues',id));toast('刪除成功')}catch(e){toast('刪除失敗',true)}};
window.edit=id=>{pending=id;$('pass').value='';$('passModal').classList.remove('hidden');setTimeout(()=>$('pass').focus(),50)};window.closePass=()=>{$('passModal').classList.add('hidden');pending=null};window.verifyPass=()=>{if($('pass').value===password){let id=pending;closePass();showEdit(id)}else{toast('密碼錯誤',true);$('pass').value=''}};
function showEdit(id){let r=issues.find(x=>x.dbId===id);if(!r)return;let fields=[['id','序號'],['date','提出日期'],['product','專案/產品名稱'],['category','議題類別'],['assignee','負責人員'],['description','議題說明'],['action','處理對策與進度'],['targetDate','預計完成日期'],['status','狀態'],['remarks','備註']];$('editForm').innerHTML=fields.map(([k,l])=>{let type=['date','targetDate'].includes(k)?'date':'text';if(k==='category')return `<div><label class="text-xs">${l}</label><select id="e_${k}" class="w-full border rounded-lg px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div>`;if(k==='status')return `<div><label class="text-xs">${l}</label><select id="e_${k}" class="w-full border rounded-lg px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div>`;return `<div class="${['description','action','remarks'].includes(k)?'md:col-span-2':''}"><label class="text-xs">${l}</label><input id="e_${k}" type="${type}" value="${esc(r[k])}" class="w-full border rounded-lg px-3 py-2 mt-1"></div>`}).join('')+'<div class="md:col-span-4 flex justify-end gap-2 pt-3 border-t"><button type="button" onclick="closeEdit()" class="bg-gray-100 px-4 py-2 rounded-lg">取消</button><button class="bg-blue-600 text-white px-4 py-2 rounded-lg">儲存</button></div>';fields.forEach(([k])=>{if($(('e_'+k)))$(('e_'+k)).value=r[k]||''});$('editForm').onsubmit=async e=>{e.preventDefault();let u={};fields.forEach(([k])=>u[k]=$('e_'+k).value);try{await updateDoc(doc(db,'artifacts',appid(),'public','data','issues',id),u);closeEdit();toast('更新成功')}catch(x){toast('更新失敗',true)}};$('editModal').classList.remove('hidden')}
window.closeEdit=()=>{$('editModal').classList.add('hidden')};$('passwordBtn').onclick=()=>$('changeModal').classList.remove('hidden');window.closeChange=()=>{$('changeModal').classList.add('hidden')};window.changePassword=async()=>{let a=$('oldPass').value,b=$('newPass').value,c=$('newPass2').value;if(a!==password)return toast('目前密碼錯誤',true);if(b!==c||b.length<3)return toast('新密碼格式不正確',true);try{await setDoc(doc(db,'artifacts',appid(),'public','data','config','settings'),{editPassword:b},{merge:true});closeChange();toast('密碼修改成功')}catch(e){toast('密碼修改失敗',true)}};
$('exportBtn').onclick=()=>{if(!issues.length)return toast('無資料可匯出',true);let a=issues.map(r=>Object.fromEntries(keys.map(k=>[H[k],r[k]||''])));let ws=XLSX.utils.json_to_sheet(a),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'產品討論議題');XLSX.writeFile(wb,'產品討論議題履歷表.xlsx');toast('匯出成功')};$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=async ev=>{try{let wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let batch=writeBatch(db),ref=collection(db,'artifacts',appid(),'public','data','issues');rows.forEach(r=>{let d=doc(ref),o={};keys.forEach(k=>o[k]=r[H[k]] instanceof Date?r[H[k]].toISOString().slice(0,10):String(r[H[k]]??''));o.timestamp=Date.now();batch.set(d,o)});await batch.commit();toast(`成功匯入 ${rows.length} 筆`)}catch(x){toast('匯入失敗，請確認 Excel 欄位',true)}e.target.value=''};rd.readAsArrayBuffer(f)};
function openConfig(){$('firebaseInput').value=localStorage.getItem('firebaseConfig')||'';$('appIdInput').value=appid();$('configModal').classList.remove('hidden')}window.openConfig=openConfig;window.closeConfig=()=>$('configModal').classList.add('hidden');window.saveConfig=()=>{try{let x=JSON.parse($('firebaseInput').value);if(!x.apiKey)throw 0;localStorage.setItem('firebaseConfig',JSON.stringify(x));localStorage.setItem('firebaseAppId',$('appIdInput').value.trim()||'product-issue-tracker-01');closeConfig();init()}catch(e){toast('Firebase JSON 格式錯誤',true)}};
$('configBtn').onclick=openConfig;$('date').value=today();init();
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);</script>
</body></html>
