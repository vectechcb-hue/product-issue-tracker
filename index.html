<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="產品議題履歷">
<link rel="manifest" href="./manifest.webmanifest">
<title>產品討論議題履歷表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>body{font-family:Inter,'Noto Sans TC',sans-serif;background:#f3f4f6}input,select,button{font-size:16px}.card{border:1px solid #e5e7eb;border-radius:16px;background:#fff}.modal{background:rgba(0,0,0,.5)}@media(min-width:768px){.mobile-only{display:none}}@media(max-width:767px){.desktop-only{display:none}}</style>
</head>
<body class="text-gray-800 min-h-screen">
<div id="toast" class="fixed z-50 left-3 right-3 bottom-4 md:left-auto md:right-5 md:w-[360px] space-y-2"></div>
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b"><div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between"><div><h1 class="text-xl sm:text-2xl font-bold text-gray-900">☑ 產品討論議題履歷表</h1><p class="text-xs text-gray-500 mt-1">雲端永久儲存・跨裝置同步・Excel・手機 PWA</p></div><div class="text-right"><div id="conn" class="text-xs text-gray-500">雲端連線中…</div><button id="reload" class="mt-1 text-xs text-blue-600">重新同步</button></div></div></header>
<main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4">
<section class="card p-4 sm:p-5"><div class="flex items-center justify-between mb-3"><h2 class="font-bold text-lg">新增議題</h2><span id="count" class="text-xs text-gray-500">0 筆</span></div><form id="addForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
<div><label class="text-xs font-medium">提出日期</label><input id="date" type="date" required class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">專案/產品名稱</label><input id="product" required placeholder="例如：RV-W473N" class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">議題類別</label><select id="category" class="w-full border rounded-xl px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div>
<div><label class="text-xs font-medium">負責人員</label><input id="assignee" required placeholder="負責人" class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div class="md:col-span-4"><label class="text-xs font-medium">議題說明</label><textarea id="description" required rows="2" class="w-full border rounded-xl px-3 py-2 mt-1" placeholder="說明問題"></textarea></div>
<div class="md:col-span-2"><label class="text-xs font-medium">處理對策與進度</label><textarea id="action" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div>
<div><label class="text-xs font-medium">預計完成日期</label><input id="targetDate" type="date" class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs font-medium">狀態</label><select id="status" class="w-full border rounded-xl px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div>
<div class="md:col-span-3"><label class="text-xs font-medium">備註</label><textarea id="remarks" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div>
<div class="flex items-end"><button class="w-full bg-blue-600 text-white rounded-xl px-4 py-3 font-bold">＋ 新增議題</button></div>
</form></section>
<section class="card p-4 sm:p-5"><div class="flex flex-col sm:flex-row gap-3 justify-between mb-4"><div class="flex-1"><input id="search" placeholder="搜尋產品、議題、負責人、備註…" class="w-full border rounded-xl px-3 py-2"></div><div class="flex gap-2"><select id="filterStatus" class="border rounded-xl px-3 py-2"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已結案</option></select><select id="filterCategory" class="border rounded-xl px-3 py-2"><option value="">全部類別</option><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div></div>
<div class="desktop-only overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">序號</th><th class="p-3 text-left">日期</th><th class="p-3 text-left">專案/產品</th><th class="p-3 text-left">類別</th><th class="p-3 text-left min-w-[220px]">議題</th><th class="p-3 text-left">負責人</th><th class="p-3 text-left min-w-[220px]">處理對策與進度</th><th class="p-3 text-left">預計完成</th><th class="p-3 text-left">狀態</th><th class="p-3 text-left">備註</th><th class="p-3">操作</th></tr></thead><tbody id="table"></tbody></table></div>
<div class="mobile-only space-y-3" id="cards"></div>
</section>
<section class="card p-4 flex flex-wrap gap-2"><button id="export" class="bg-green-600 text-white rounded-xl px-4 py-3">匯出 Excel</button><button id="importBtn" class="bg-gray-100 rounded-xl px-4 py-3">匯入 Excel</button><input id="file" type="file" accept=".xlsx,.xls" hidden><button id="clearSearch" class="bg-gray-100 rounded-xl px-4 py-3">清除搜尋</button></section>
</main>
<div id="editModal" class="hidden fixed inset-0 modal z-50 p-3 items-center justify-center"><div class="bg-white rounded-2xl w-full max-w-3xl max-h-[92vh] overflow-y-auto p-5"><div class="flex justify-between items-center mb-4"><h2 class="font-bold text-lg">編輯議題</h2><button id="closeEdit" class="text-xl">✕</button></div><form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="editDbId" type="hidden"><div><label class="text-xs">序號</label><input id="editId" class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs">提出日期</label><input id="editDate" type="date" class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs">專案/產品名稱</label><input id="editProduct" required class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs">類別</label><select id="editCategory" class="w-full border rounded-xl px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label class="text-xs">負責人員</label><input id="editAssignee" required class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs">預計完成日期</label><input id="editTarget" type="date" class="w-full border rounded-xl px-3 py-2 mt-1"></div><div class="md:col-span-2"><label class="text-xs">議題說明</label><textarea id="editDescription" rows="3" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div><div class="md:col-span-2"><label class="text-xs">處理對策與進度</label><textarea id="editAction" rows="3" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div><div><label class="text-xs">狀態</label><select id="editStatus" class="w-full border rounded-xl px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div><label class="text-xs">備註</label><input id="editRemarks" class="w-full border rounded-xl px-3 py-2 mt-1"></div><div class="md:col-span-2 flex justify-end gap-2 pt-2"><button type="button" id="cancelEdit" class="bg-gray-100 rounded-xl px-4 py-2">取消</button><button class="bg-blue-600 text-white rounded-xl px-4 py-2">儲存</button></div></form></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import{initializeFirestore,persistentLocalCache,persistentSingleTabManager,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,writeBatch,query,orderBy,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCgE9Xj3RWmoDs0gaCbwJbKZ6N7HjFw4tA',authDomain:'vectech-2114d.firebaseapp.com',projectId:'vectech-2114d',storageBucket:'vectech-2114d.firebasestorage.app',messagingSenderId:'1099462295117',appId:'1:1099462295117:web:ce5a0a6ef0749d1f8f2604'};
const APP_ID='product-issue-tracker-01';
const app=initializeApp(firebaseConfig);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentSingleTabManager()})});
const issuesCol=collection(db,'artifacts',APP_ID,'public','data','issues');
let issues=[],editPassword='admin';
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('en-CA');
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,error=false){const d=document.createElement('div');d.className=(error?'bg-red-600':'bg-green-600')+' text-white rounded-xl px-4 py-3 shadow mb-2';d.textContent=msg;$('toast').appendChild(d);setTimeout(()=>d.remove(),3000)}
function statusClass(s){return s==='已結案'?'bg-green-100 text-green-700':s==='處理中'?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}
function visible(){const s=$('search').value.trim().toLowerCase(),fs=$('filterStatus').value,fc=$('filterCategory').value;return issues.filter(r=>(!fs||r.status===fs)&&(!fc||r.category===fc)&&(!s||Object.values(r).some(v=>String(v??'').toLowerCase().includes(s))))}
function render(){const rows=visible();$('count').textContent=`${issues.length} 筆`;if(!rows.length){$('table').innerHTML='<tr><td colspan="11" class="p-10 text-center text-gray-500">目前沒有符合條件的資料</td></tr>';$('cards').innerHTML='<div class="text-center text-gray-500 py-10">目前沒有符合條件的資料</div>';return}$('table').innerHTML=rows.map(r=>`<tr class="border-t align-top"><td class="p-3">${escapeHtml(r.id)}</td><td class="p-3 whitespace-nowrap">${escapeHtml(r.date)}</td><td class="p-3 font-medium">${escapeHtml(r.product)}</td><td class="p-3">${escapeHtml(r.category)}</td><td class="p-3">${escapeHtml(r.description)}</td><td class="p-3 whitespace-nowrap">${escapeHtml(r.assignee)}</td><td class="p-3">${escapeHtml(r.action)}</td><td class="p-3 whitespace-nowrap">${escapeHtml(r.targetDate)}</td><td class="p-3"><span class="px-2 py-1 rounded-full text-xs ${statusClass(r.status)}">${escapeHtml(r.status)}</span></td><td class="p-3">${escapeHtml(r.remarks)}</td><td class="p-3 whitespace-nowrap"><button class="text-blue-600 mr-3" onclick="window.editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="window.removeIssue('${r.dbId}')">刪除</button></td></tr>`).join('');$('cards').innerHTML=rows.map(r=>`<article class="card p-4"><div class="flex justify-between gap-3"><div><div class="font-bold text-lg">#${escapeHtml(r.id)} ${escapeHtml(r.product)}</div><div class="text-xs text-gray-500 mt-1">${escapeHtml(r.date)} ・ ${escapeHtml(r.category)} ・ ${escapeHtml(r.assignee)}</div></div><span class="shrink-0 px-2 py-1 rounded-full text-xs h-fit ${statusClass(r.status)}">${escapeHtml(r.status)}</span></div><div class="mt-3 space-y-2 text-sm"><div><b>議題：</b>${escapeHtml(r.description)}</div><div><b>進度：</b>${escapeHtml(r.action)||'—'}</div><div><b>預計完成：</b>${escapeHtml(r.targetDate)||'—'}</div><div><b>備註：</b>${escapeHtml(r.remarks)||'—'}</div></div><div class="border-t mt-3 pt-3 flex justify-end gap-4"><button class="text-blue-600" onclick="window.editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="window.removeIssue('${r.dbId}')">刪除</button></div></article>`).join('')}
function nextId(){return String(issues.reduce((m,r)=>Math.max(m,parseInt(r.id)||0),0)+1)}
async function addIssue(e){e.preventDefault();try{$('conn').textContent='雲端寫入中…';await addDoc(issuesCol,{id:nextId(),date:$('date').value,product:$('product').value,category:$('category').value,description:$('description').value,assignee:$('assignee').value,action:$('action').value,targetDate:$('targetDate').value,status:$('status').value,remarks:$('remarks').value,timestamp:serverTimestamp()});e.target.reset();$('date').value=today();toast('新增成功，已寫入雲端')}catch(e){console.error(e);toast('新增失敗：'+(e.code||e.message),true)}finally{$('conn').textContent='雲端同步中'}}
window.removeIssue=async id=>{if(!confirm('確定要刪除這筆議題嗎？'))return;try{await deleteDoc(doc(db,'artifacts',APP_ID,'public','data','issues',id));toast('刪除成功')}catch(e){toast('刪除失敗：'+(e.code||e.message),true)}};
window.editIssue=id=>{const r=issues.find(x=>x.dbId===id);if(!r)return;$('editDbId').value=id;$('editId').value=r.id||'';$('editDate').value=r.date||'';$('editProduct').value=r.product||'';$('editCategory').value=r.category||'其他';$('editAssignee').value=r.assignee||'';$('editDescription').value=r.description||'';$('editAction').value=r.action||'';$('editTarget').value=r.targetDate||'';$('editStatus').value=r.status||'待處理';$('editRemarks').value=r.remarks||'';$('editModal').classList.remove('hidden');$('editModal').classList.add('flex')};
$('editForm').onsubmit=async e=>{e.preventDefault();const id=$('editDbId').value;try{await updateDoc(doc(db,'artifacts',APP_ID,'public','data','issues',id),{id:$('editId').value,date:$('editDate').value,product:$('editProduct').value,category:$('editCategory').value,assignee:$('editAssignee').value,description:$('editDescription').value,action:$('editAction').value,targetDate:$('editTarget').value,status:$('editStatus').value,remarks:$('editRemarks').value,updatedAt:serverTimestamp()});closeEdit();toast('更新成功，已同步雲端')}catch(e){toast('更新失敗：'+(e.code||e.message),true)}};
function closeEdit(){$('editModal').classList.add('hidden');$('editModal').classList.remove('flex')}$('closeEdit').onclick=closeEdit;$('cancelEdit').onclick=closeEdit;
$('search').oninput=render;$('filterStatus').onchange=render;$('filterCategory').onchange=render;$('clearSearch').onclick=()=>{$('search').value='';$('filterStatus').value='';$('filterCategory').value='';render()};$('reload').onclick=()=>location.reload();$('date').value=today();
$('export').onclick=()=>{const rows=visible();if(!rows.length)return toast('沒有資料可匯出',true);const data=rows.map(r=>({'序號':r.id||'','提出日期':r.date||'','專案/產品名稱':r.product||'','議題類別':r.category||'','議題說明':r.description||'','負責人員':r.assignee||'','處理對策與進度':r.action||'','預計完成日期':r.targetDate||'','狀態':r.status||'','備註':r.remarks||''}));const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'產品討論議題');XLSX.writeFile(wb,'產品討論議題履歷表.xlsx')};
$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async ev=>{try{const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);if(!rows.length)throw new Error('Excel 沒有資料');const batch=writeBatch(db);rows.forEach(row=>{const ref=doc(issuesCol),d=x=>x instanceof Date?x.toLocaleDateString('en-CA'):String(x??'');batch.set(ref,{id:d(row['序號'])||nextId(),date:d(row['提出日期']),product:d(row['專案/產品名稱']),category:d(row['議題類別'])||'其他',description:d(row['議題說明']),assignee:d(row['負責人員']),action:d(row['處理對策與進度']),targetDate:d(row['預計完成日期']),status:d(row['狀態'])||'待處理',remarks:d(row['備註']),timestamp:serverTimestamp()})});await batch.commit();toast(`成功匯入 ${rows.length} 筆`)}catch(x){toast('匯入失敗：'+(x.code||x.message),true)}finally{$('file').value=''}};rd.readAsArrayBuffer(f)};
onSnapshot(query(issuesCol,orderBy('id')),snap=>{issues=snap.docs.map(d=>({dbId:d.id,...d.data()}));issues.sort((a,b)=>(parseInt(a.id)||0)-(parseInt(b.id)||0));render();$('conn').textContent='● 雲端已同步'},err=>{console.error(err);$('conn').textContent='連線失敗：'+(err.code||err.message);toast('讀取雲端資料失敗：'+(err.code||err.message),true)});
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);</script>
</body></html>
