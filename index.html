<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="產品議題履歷"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script><title>產品討論議題履歷表</title><style>
:root{--b:#2563eb;--g:#16a34a;--p:#9333ea;--r:#dc2626;--bg:#f3f4f6;--line:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit;font-size:16px}button{cursor:pointer}.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.barin,.wrap{max-width:1100px;margin:auto}.barin{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:11px;background:#eff6ff;color:var(--b);display:grid;place-items:center;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}.wrap{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;box-shadow:0 3px 14px #0f172a0d}.head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.body{padding:14px 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#374151;margin:0 0 5px}input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:11px;background:#fff;padding:10px 11px;outline:none}textarea{min-height:82px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px}.blue{background:var(--b);color:#fff}.green{background:var(--g);color:#fff}.purple{background:var(--p);color:#fff}.light{background:#f3f4f6;color:#374151}.danger{background:#fee2e2;color:#b91c1c}.tools{display:flex;gap:8px;flex-wrap:wrap}.search{display:grid;grid-template-columns:1fr 150px 150px;gap:8px}.list{display:grid;gap:10px;margin-top:12px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.top{display:flex;justify-content:space-between;gap:8px}.title{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:4px 8px;height:max-content}.pending{background:#fee2e2;color:#b91c1c}.doing{background:#ffedd5;color:#c2410c}.done{background:#dcfce7;color:#15803d}.body2{display:grid;gap:7px;margin-top:10px;font-size:14px}.k{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}.imgs{display:flex;gap:7px;overflow:auto}.imgs img{width:58px;height:58px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.modal{position:fixed;inset:0;z-index:50;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal.hide{display:none}.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 10px 10px;padding:16px}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pre{display:flex;gap:8px;overflow:auto;padding-top:8px}.th{position:relative}.pre img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.th button{position:absolute;top:-6px;right:-6px;width:23px;height:23px;border:0;border-radius:50%;background:#111827;color:#fff}.status{font-size:12px;color:var(--muted)}.ok{color:var(--g)}.err{color:var(--r)}.toast{position:fixed;left:12px;right:12px;bottom:14px;z-index:100}.toast div{margin-top:7px;background:#111827;color:#fff;border-radius:11px;padding:10px 12px;font-size:14px}.toast .ok{background:#166534}.toast .err{background:#991b1b}.empty{text-align:center;color:var(--muted);padding:28px 8px}.install{display:none}.install.show{display:inline-flex}.foot{font-size:11px;color:var(--muted);text-align:center;padding:8px 0 25px}@media(min-width:800px){.modal{align-items:center}.sheet{border-radius:18px}.wrap{padding:22px 18px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}.tools .btn{flex:1}.brand h1{font-size:17px}}
</style></head><body><header class="bar"><div class="barin"><div class="brand"><div class="mark">✓</div><div><h1>產品討論議題履歷表</h1><p>手機 APP／PWA・可離線使用・Excel 匯入/匯出</p></div></div><button id="install" class="btn light install">＋ 安裝 APP</button></div></header><main class="wrap"><section class="card"><div class="head"><strong>新增議題</strong><span id="status" class="status">啟動中…</span></div><div class="body"><form id="form"><div class="grid"><div><label>提出日期</label><input id="date" type="date" required></div><div><label>專案／產品名稱</label><input id="product" required placeholder="例如：VECTECH 4500"></div><div><label>議題類別</label><select id="category"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label>負責人員</label><input id="assignee" required></div><div class="full"><label>議題說明</label><textarea id="description" required></textarea></div><div class="full"><label>處理對策與進度</label><textarea id="action"></textarea></div><div><label>預計完成日期</label><input id="target" type="date"></div><div><label>狀態</label><select id="state"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div class="full"><label>備註</label><textarea id="remarks"></textarea></div><div class="full"><label>現場照片（手機可直接拍照，可多張）</label><input id="photos" type="file" accept="image/*" capture="environment" multiple><div id="newpre" class="pre"></div></div></div><div class="actions"><button class="btn blue" type="submit">＋ 確定新增</button><button class="btn light" type="button" id="clear">清除</button></div></form></div></section><section class="card"><div class="head"><strong>議題紀錄 <span id="count" class="status"></span></strong><div class="tools"><button class="btn light" id="import">匯入 Excel</button><button class="btn green" id="export">匯出 Excel</button><button class="btn purple" id="passbtn">修改密碼</button></div></div><div class="body"><div class="search"><input id="q" placeholder="搜尋產品、議題、負責人…"><select id="fs"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已結案</option></select><select id="fc"><option value="">全部類別</option><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><input id="xlsx" type="file" accept=".xlsx,.xls" hidden><div id="list" class="list"></div></div></section><div class="foot">本版本採手機本機資料庫儲存，不依賴 Firebase；可用 Excel 匯出／匯入在裝置間移轉資料。</div></main><div id="editm" class="modal hide"><div class="sheet"><div class="sheethead"><strong>編輯議題</strong><button class="btn light" id="closeedit">關閉</button></div><form id="editform"><input id="eid" type="hidden"><div class="grid"><div><label>序號</label><input id="e_id"></div><div><label>提出日期</label><input id="e_date" type="date" required></div><div><label>專案／產品名稱</label><input id="e_product" required></div><div><label>類別</label><select id="e_category"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label>負責人員</label><input id="e_assignee" required></div><div><label>狀態</label><select id="e_state"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div class="full"><label>議題說明</label><textarea id="e_desc" required></textarea></div><div class="full"><label>處理對策與進度</label><textarea id="e_action"></textarea></div><div><label>預計完成日期</label><input id="e_target" type="date"></div><div><label>備註</label><textarea id="e_remarks"></textarea></div><div class="full"><label>現有照片</label><div id="epre" class="pre"></div><label style="margin-top:10px">新增照片</label><input id="e_photos" type="file" accept="image/*" capture="environment" multiple></div></div><div class="actions"><button class="btn blue">儲存更新</button><button type="button" class="btn light" id="canceledit">取消</button></div></form></div></div><div id="passm" class="modal hide"><div class="sheet"><div class="sheethead"><strong>請輸入編輯密碼</strong><button class="btn light" id="closepass">關閉</button></div><input id="pass" type="password" placeholder="預設：admin"><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn blue" id="verify">確認</button></div></div></div><div id="changem" class="modal hide"><div class="sheet"><div class="sheethead"><strong>修改編輯密碼</strong><button class="btn light" id="closechange">關閉</button></div><div class="grid"><div><label>目前密碼</label><input id="old" type="password"></div><div><label>新密碼</label><input id="np" type="password"></div><div><label>確認新密碼</label><input id="np2" type="password"></div></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn purple" id="savepass">儲存</button></div></div></div><div id="toast" class="toast"></div><script>
const DB='productIssueTrackerMobileV2',STORE='issues';let issues=[],pwd=localStorage.getItem('issuePwd')||'admin',pending=null,deferred=null;const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA');$('date').value=today();function msg(t,c='ok'){const d=document.createElement('div');d.className=c;d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),2800)}function conn(t,c=''){ $('status').textContent=t;$('status').className='status '+c }function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random()}function dbreq(mode='readonly'){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'dbId'});r.onsuccess=()=>{const db=r.result,tx=db.transaction(STORE,mode);ok(tx.objectStore(STORE))};r.onerror=()=>no(r.error)})}async function all(){const s=await dbreq();return new Promise((ok,no)=>{const r=s.getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}async function put(x){const s=await dbreq('readwrite');return new Promise((ok,no)=>{s.put(x);s.transaction.oncomplete=ok;s.transaction.onerror=()=>no(s.transaction.error)})}async function del(id){const s=await dbreq('readwrite');return new Promise((ok,no)=>{s.delete(id);s.transaction.oncomplete=ok;s.transaction.onerror=()=>no(s.transaction.error)})}async function image(file){const b=await createImageBitmap(file),m=1400,sc=Math.min(1,m/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*sc;c.height=b.height*sc;c.getContext('2d').drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/jpeg',.82)}async function imgs(files){return Promise.all([...files].map(image))}function cls(s){return s==='已結案'?'done':s==='處理中'?'doing':'pending'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('q').value.trim().toLowerCase(),fs=$('fs').value,fc=$('fc').value;const rs=issues.filter(r=>(!fs||r.state===fs)&&(!fc||r.category===fc)&&(!q||[r.id,r.product,r.category,r.assignee,r.description,r.action,r.remarks].join(' ').toLowerCase().includes(q)));$('count').textContent=`（${rs.length}/${issues.length}）`;if(!rs.length){$('list').innerHTML='<div class="empty">目前沒有符合條件的紀錄</div>';return}$('list').innerHTML=rs.map(r=>`<article class="item"><div class="top"><div><div class="title">#${esc(r.id)} ${esc(r.product)}</div><div class="sub">${esc(r.date)}・${esc(r.category)}・${esc(r.assignee)}</div></div><span class="badge ${cls(r.state)}">${esc(r.state)}</span></div><div class="body2"><div><span class="k">議題說明</span>${esc(r.description)}</div><div><span class="k">處理對策與進度</span>${esc(r.action||'—')}</div><div><span class="k">預計完成</span>${esc(r.target||'—')}</div><div><span class="k">備註</span>${esc(r.remarks||'—')}</div>${(r.images||[]).length?`<div><span class="k">現場照片</span><div class="imgs">${r.images.map(x=>`<img src="${x}" loading="lazy">`).join('')}</div></div>`:''}</div><div class="actions"><button class="btn light" onclick="ask('${r.dbId}')">編輯</button><button class="btn danger" onclick="removeIssue('${r.dbId}')">刪除</button></div></article>`).join('')}async function load(){issues=(await all()).sort((a,b)=>(+a.id)-(+b.id));render();conn('● 本機資料庫已就緒','ok')}function next(){return String(issues.reduce((m,r)=>Math.max(m,parseInt(r.id)||0),0)+1)}$('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='儲存中…';try{const it={dbId:uid(),id:next(),date:$('date').value,product:$('product').value,category:$('category').value,assignee:$('assignee').value,description:$('description').value,action:$('action').value,target:$('target').value,state:$('state').value,remarks:$('remarks').value,images:await imgs($('photos').files)};await put(it);issues.push(it);e.target.reset();$('date').value=today();$('newpre').innerHTML='';render();msg('新增成功')}catch(e){console.error(e);msg('新增失敗','err')}b.disabled=false;b.textContent='＋ 確定新增'};$('clear').onclick=()=>{$('form').reset();$('date').value=today();$('newpre').innerHTML=''};$('photos').onchange=async e=>{$('newpre').innerHTML=(await imgs(e.target.files)).map(x=>`<img src="${x}">`).join('')};$('q').oninput=render;$('fs').onchange=render;$('fc').onchange=render;window.ask=id=>{pending=id;open('passm');$('pass').value='';setTimeout(()=>$('pass').focus(),30)};$('verify').onclick=()=>{$('pass').value===pwd?(close('passm'),openEdit(pending)):msg('密碼錯誤','err')};$('closepass').onclick=()=>close('passm');function open(id){$(id).classList.remove('hide')}function close(id){$(id).classList.add('hide')}async function openEdit(id){const r=issues.find(x=>x.dbId===id);if(!r)return;$('eid').value=id;$('e_id').value=r.id;$('e_date').value=r.date;$('e_product').value=r.product;$('e_category').value=r.category;$('e_assignee').value=r.assignee;$('e_state').value=r.state;$('e_desc').value=r.description;$('e_action').value=r.action||'';$('e_target').value=r.target||'';$('e_remarks').value=r.remarks||'';$('e_photos').value='';$('epre').innerHTML=(r.images||[]).map((x,i)=>`<div class="th"><img src="${x}"><button type="button" onclick="rmImg(${i})">×</button></div>`).join('');open('editm')}window.rmImg=async i=>{const r=issues.find(x=>x.dbId===$('eid').value);r.images=r.images.filter((_,n)=>n!==i);await put(r);openEdit(r.dbId)};$('editform').onsubmit=async e=>{e.preventDefault();const r=issues.find(x=>x.dbId===$('eid').value);try{Object.assign(r,{id:$('e_id').value,date:$('e_date').value,product:$('e_product').value,category:$('e_category').value,assignee:$('e_assignee').value,state:$('e_state').value,description:$('e_desc').value,action:$('e_action').value,target:$('e_target').value,remarks:$('e_remarks').value,images:[...(r.images||[]),...(await imgs($('e_photos').files))]});await put(r);issues.sort((a,b)=>(+a.id)-(+b.id));render();close('editm');msg('更新成功')}catch(e){msg('更新失敗','err')}};$('closeedit').onclick=()=>close('editm');$('canceledit').onclick=()=>close('editm');window.removeIssue=async id=>{if(confirm('確定刪除這筆議題？')){await del(id);issues=issues.filter(x=>x.dbId!==id);render();msg('刪除成功')}};$('passbtn').onclick=()=>{open('changem');$('old').value='';$('np').value='';$('np2').value=''};$('closechange').onclick=()=>close('changem');$('savepass').onclick=()=>{if($('old').value!==pwd)return msg('目前密碼錯誤','err');if($('np').value.length<3||$('np').value!==$('np2').value)return msg('新密碼格式不正確','err');pwd=$('np').value;localStorage.setItem('issuePwd',pwd);close('changem');msg('密碼修改成功')};$('export').onclick=()=>{if(!issues.length)return msg('目前沒有資料','err');const d=issues.map(r=>({'序號':r.id,'提出日期':r.date,'專案/產品名稱':r.product,'議題類別':r.category,'議題說明':r.description,'負責人員':r.assignee,'處理對策與進度':r.action,'預計完成日期':r.target,'狀態':r.state,'備註':r.remarks,'附圖數量':(r.images||[]).length}));const ws=XLSX.utils.json_to_sheet(d),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'產品討論議題');XLSX.writeFile(wb,'產品討論議題履歷表.xlsx');msg('Excel 匯出成功')};$('import').onclick=()=>$('xlsx').click();$('xlsx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);for(const x of rows){const r={dbId:uid(),id:String(x['序號']??next()),date:x['提出日期'] instanceof Date?x['提出日期'].toLocaleDateString('en-CA'):String(x['提出日期']??''),product:String(x['專案/產品名稱']??''),category:String(x['議題類別']??'其他'),description:String(x['議題說明']??''),assignee:String(x['負責人員']??''),action:String(x['處理對策與進度']??''),target:x['預計完成日期'] instanceof Date?x['預計完成日期'].toLocaleDateString('en-CA'):String(x['預計完成日期']??''),state:String(x['狀態']??'待處理'),remarks:String(x['備註']??''),images:[]};await put(r);issues.push(r)}issues.sort((a,b)=>(+a.id)-(+b.id));render();msg(`成功匯入 ${rows.length} 筆`)}catch(e){console.error(e);msg('Excel 匯入失敗','err')}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').classList.add('show')});$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').classList.remove('show')};window.addEventListener('appinstalled',()=>msg('APP 安裝完成'));async function boot(){try{if('serviceWorker'in navigator)await navigator.serviceWorker.register('./sw.js');await load()}catch(e){console.error(e);conn('啟動失敗','err');msg('APP 啟動失敗','err')}}boot();</script></body></html>
