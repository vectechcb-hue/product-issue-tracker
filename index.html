<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.webmanifest">
<title>產品討論議題履歷表</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
body{font-family:Inter,'Noto Sans TC',sans-serif;background:#f3f4f6}input,select,button,textarea{font-size:16px}.card{border:1px solid #e5e7eb;border-radius:16px;background:#fff}.modal{background:rgba(0,0,0,.52)}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.thumb{width:100%;height:90px;object-fit:cover;border-radius:12px;border:1px solid #e5e7eb;background:#f8fafc}@media(min-width:640px){.photo-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(min-width:768px){.mobile-only{display:none}}@media(max-width:767px){.desktop-only{display:none}}button:disabled{opacity:.6;cursor:not-allowed}

<body class="text-gray-800 min-h-screen">
<div id="toast" class="fixed z-[100] left-3 right-3 bottom-4 md:left-auto md:right-5 md:w-[420px] space-y-2"></div>
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b"><div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-3"><div><h1 class="text-xl sm:text-2xl font-bold">☑ 產品討論議題履歷表</h1><p class="text-xs text-gray-500 mt-1">雲端永久儲存・跨裝置同步・多張照片・Excel・手機 PWA</p></div><div class="text-right shrink-0"><div id="conn" class="text-xs text-gray-500">Firebase 連線中…</div><div class="mt-1 flex justify-end gap-3"><button id="passwordBtn" class="text-xs">🔒 編輯密碼</button><button id="reload" class="text-xs text-blue-600">重新同步</button></div></div></div></header>
<main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4">
<section class="card p-4 sm:p-5"><div class="flex items-center justify-between mb-3"><h2 class="font-bold text-lg">新增議題</h2><span id="count" class="text-xs text-gray-500">0 筆</span></div>
<form id="addForm" class="grid grid-cols-1 md:grid-cols-4 gap-3">
<div><label class="text-xs">提出日期</label><input id="date" type="date" required class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs">專案／產品名稱</label><input id="product" required class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs">議題類別</label><select id="category" class="w-full border rounded-xl px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div>
<div><label class="text-xs">負責人員</label><input id="assignee" required class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div class="md:col-span-4"><label class="text-xs">議題說明</label><textarea id="description" required rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div>
<div class="md:col-span-2"><label class="text-xs">處理對策與進度</label><textarea id="action" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div>
<div><label class="text-xs">預計完成日期</label><input id="targetDate" type="date" class="w-full border rounded-xl px-3 py-2 mt-1"></div>
<div><label class="text-xs">狀態</label><select id="status" class="w-full border rounded-xl px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div>
<div class="md:col-span-3"><label class="text-xs">備註</label><textarea id="remarks" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div>
<div class="flex items-end"><button id="addBtn" class="w-full bg-blue-600 text-white rounded-xl px-4 py-3 font-bold">＋ 確定新增</button></div>
<div class="md:col-span-4 rounded-xl border border-dashed bg-slate-50 p-3"><div class="flex items-center justify-between gap-2"><div><b class="text-sm">📷 附加照片（可多張）</b><div class="text-xs text-gray-500 mt-1">最多 12 張；會自動壓縮後上傳雲端。</div></div><label class="cursor-pointer bg-white border rounded-xl px-3 py-2 text-sm">選擇照片<input id="photoFiles" type="file" accept="image/*" multiple class="hidden"></label></div><div id="photoPreview" class="photo-grid mt-3"></div></div>
</form></section>
<section class="card p-4 sm:p-5"><div class="flex flex-col sm:flex-row gap-3 justify-between mb-4"><input id="search" placeholder="搜尋產品、議題、負責人、備註…" class="flex-1 border rounded-xl px-3 py-2"><div class="flex gap-2"><select id="filterStatus" class="border rounded-xl px-3 py-2"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已結案</option></select><select id="filterCategory" class="border rounded-xl px-3 py-2"><option value="">全部類別</option><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div></div><div class="desktop-only overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3">序號</th><th class="p-3">日期</th><th class="p-3">專案/產品</th><th class="p-3">類別</th><th class="p-3">議題</th><th class="p-3">負責人</th><th class="p-3">照片</th><th class="p-3">處理對策與進度</th><th class="p-3">預計完成</th><th class="p-3">狀態</th><th class="p-3">備註</th><th class="p-3">操作</th></tr></thead><tbody id="table"></tbody></table></div><div class="mobile-only space-y-3" id="cards"></div></section>
<section class="card p-4 flex flex-wrap gap-2"><button id="export" class="bg-green-600 text-white rounded-xl px-4 py-3">匯出 Excel（含照片）</button><button id="importBtn" class="bg-gray-100 rounded-xl px-4 py-3">匯入 Excel</button><input id="file" type="file" accept=".xlsx,.xls" hidden></section>
</main>
<div id="editModal" class="hidden fixed inset-0 modal z-50 p-3 items-center justify-center overflow-auto"><div class="bg-white rounded-2xl w-full max-w-4xl p-5 my-5"><div class="flex justify-between mb-4"><div><h2 class="font-bold text-lg">編輯議題</h2><div class="text-xs text-gray-500">已通過編輯密碼驗證</div></div><button id="closeEdit">✕</button></div><form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="editDbId" type="hidden"><input id="editId" placeholder="序號" class="border rounded-xl px-3 py-2"><input id="editDate" type="date" class="border rounded-xl px-3 py-2"><input id="editProduct" required placeholder="專案/產品名稱" class="border rounded-xl px-3 py-2"><input id="editAssignee" required placeholder="負責人員" class="border rounded-xl px-3 py-2"><select id="editCategory" class="border rounded-xl px-3 py-2"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select><select id="editStatus" class="border rounded-xl px-3 py-2"><option>待處理</option><option>處理中</option><option>已結案</option></select><textarea id="editDescription" required placeholder="議題說明" class="md:col-span-2 border rounded-xl px-3 py-2"></textarea><textarea id="editAction" placeholder="處理對策與進度" class="md:col-span-2 border rounded-xl px-3 py-2"></textarea><input id="editTarget" type="date" class="border rounded-xl px-3 py-2"><input id="editRemarks" placeholder="備註" class="border rounded-xl px-3 py-2"><div class="md:col-span-2 rounded-xl border p-3"><div class="text-sm font-semibold">目前照片（× 可移除）</div><div id="editPhotos" class="photo-grid mt-3"></div></div><div class="md:col-span-2 rounded-xl border border-dashed bg-slate-50 p-3"><div class="flex items-center justify-between gap-2"><div class="text-sm font-semibold">新增照片</div><label class="cursor-pointer bg-white border rounded-xl px-3 py-2 text-sm">選擇照片<input id="editPhotoFiles" type="file" accept="image/*" multiple class="hidden"></label></div><div id="editPhotoPreview" class="photo-grid mt-3"></div></div><div class="md:col-span-2 flex justify-between gap-2"><button type="button" id="deleteCurrent" class="bg-red-50 text-red-600 rounded-xl px-4 py-2">刪除此議題</button><div class="flex gap-2"><button type="button" id="cancelEdit" class="bg-gray-100 rounded-xl px-4 py-2">取消</button><button class="bg-blue-600 text-white rounded-xl px-4 py-2">儲存</button></div></div></form></div></div>
<div id="passwordModal" class="hidden fixed inset-0 modal z-[60] p-3 items-center justify-center"><div class="bg-white rounded-2xl w-full max-w-md p-5"><div class="flex justify-between items-center"><div><h2 id="pwTitle" class="font-bold text-lg">🔒 編輯密碼</h2><div id="pwHint" class="text-xs text-gray-500 mt-1"></div></div><button id="closePw">✕</button></div><div id="pwLogin" class="hidden mt-5 space-y-3"><input id="currentPw" type="password" placeholder="輸入編輯密碼" class="w-full border rounded-xl px-3 py-3"><button id="unlockBtn" class="w-full bg-blue-600 text-white rounded-xl px-4 py-3 font-bold">確認密碼</button></div><div id="pwSetup" class="hidden mt-5 space-y-3"><input id="setupPw" type="password" placeholder="設定新密碼（至少 4 碼）" class="w-full border rounded-xl px-3 py-3"><input id="setupPw2" type="password" placeholder="再次輸入新密碼" class="w-full border rounded-xl px-3 py-3"><button id="setupBtn" class="w-full bg-blue-600 text-white rounded-xl px-4 py-3 font-bold">設定編輯密碼</button></div><div id="pwChange" class="hidden mt-5 space-y-3"><div class="rounded-xl bg-green-50 text-green-700 p-3 text-sm">密碼正確，可以更改密碼。</div><input id="changePw" type="password" placeholder="輸入新密碼（至少 4 碼）" class="w-full border rounded-xl px-3 py-3"><input id="changePw2" type="password" placeholder="再次輸入新密碼" class="w-full border rounded-xl px-3 py-3"><button id="changeBtn" class="w-full bg-slate-800 text-white rounded-xl px-4 py-3 font-bold">更改密碼</button></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,writeBatch,serverTimestamp,getDoc,setDoc,getDocs}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
import{getStorage,ref as storageRef,uploadBytes,getDownloadURL,deleteObject}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';
const cfg={apiKey:'AIzaSyCgE9Xj3RWmoDs0gaCbwJbKZ6N7HjFw4tA',authDomain:'vectech-2114d.firebaseapp.com',projectId:'vectech-2114d',storageBucket:'vectech-2114d.firebasestorage.app',messagingSenderId:'1099462295117',appId:'1:1099462295117:web:ce5a0a6ef0749d1f8f2604'},APP='product-issue-tracker-01',MAXP=12,MAXD=1800,Q=.82,ITER=120000;
let db,storage,issues=[],unsub,addFiles=[],editFiles=[],keepPhotos=[],pwReady=false,unlockUntil=0,pendingEdit=null;
const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const path=['artifacts',APP,'public','data'],col=()=>collection(db,...path,'issues'),iref=id=>doc(db,...path,'issues',id),settings=()=>doc(db,...path,'config','settings');
function toast(m,e=false){const d=document.createElement('div');d.className=(e?'bg-red-600':'bg-green-600')+' text-white rounded-xl p-3 shadow';d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),6000)}
function err(label,e){console.error(label,e);const c=e?.code||'unknown',m=e?.message||String(e);$('conn').textContent=label+'：'+c;$('conn').className='text-xs text-red-600';toast(label+'：'+c+'｜'+m,true)}
function filtered(){const q=$('search').value.toLowerCase().trim(),s=$('filterStatus').value,c=$('filterCategory').value;return issues.filter(r=>(!s||r.status===s)&&(!c||r.category===c)&&(!q||[r.id,r.product,r.category,r.assignee,r.description,r.action,r.remarks].join(' ').toLowerCase().includes(q)))}
function render(){const rows=filtered();$('count').textContent=`${rows.length}/${issues.length} 筆`;const photoStrip=r=>(r.photos?.length?`<div class="flex -space-x-2">${r.photos.slice(0,3).map(p=>`<img src="${esc(p.url)}" class="w-9 h-9 rounded-lg object-cover border-2 border-white" loading="lazy">`).join('')}${r.photos.length>3?`<span class="w-9 h-9 rounded-lg bg-slate-100 border-2 border-white flex items-center justify-center text-xs">+${r.photos.length-3}</span>`:''}</div>`:'<span class="text-xs text-gray-400">無</span>');$('table').innerHTML=rows.map(r=>`<tr class="border-t align-top"><td class="p-3">${esc(r.id)}</td><td class="p-3">${esc(r.date)}</td><td class="p-3">${esc(r.product)}</td><td class="p-3">${esc(r.category)}</td><td class="p-3">${esc(r.description)}</td><td class="p-3">${esc(r.assignee)}</td><td class="p-3">${photoStrip(r)}</td><td class="p-3">${esc(r.action)}</td><td class="p-3">${esc(r.targetDate)}</td><td class="p-3">${esc(r.status)}</td><td class="p-3">${esc(r.remarks)}</td><td class="p-3 whitespace-nowrap"><button class="text-blue-600 mr-2" onclick="editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="removeIssue('${r.dbId}')">刪除</button></td></tr>`).join('');$('cards').innerHTML=rows.map(r=>`<article class="card p-4"><div class="flex justify-between gap-3"><div><div class="font-bold">#${esc(r.id)} ${esc(r.product)}</div><div class="text-xs text-gray-500">${esc(r.date)} ・ ${esc(r.category)} ・ ${esc(r.assignee)}</div></div><span class="px-2 py-1 rounded-full text-xs h-fit ${r.status==='已結案'?'bg-green-100 text-green-700':r.status==='處理中'?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}">${esc(r.status)}</span></div>${r.photos?.length?`<div class="mt-3 flex gap-2 overflow-auto pb-1">${r.photos.map(p=>`<a href="${esc(p.url)}" target="_blank"><img src="${esc(p.url)}" class="thumb" loading="lazy"></a>`).join('')}</div>`:''}<div class="mt-3 space-y-2 text-sm"><div><b>議題：</b>${esc(r.description)}</div><div><b>進度：</b>${esc(r.action)||'—'}</div><div><b>預計：</b>${esc(r.targetDate)||'—'}</div><div><b>備註：</b>${esc(r.remarks)||'—'}</div></div><div class="border-t mt-3 pt-3 flex justify-end gap-4"><button class="text-blue-600" onclick="editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="removeIssue('${r.dbId}')">刪除</button></div></article>`).join('')}
function subscribe(){if(unsub)unsub();unsub=onSnapshot(col(),s=>{issues=s.docs.map(d=>({dbId:d.id,...d.data()}));issues.sort((a,b)=>(+a.id||0)-(+b.id||0));render();$('conn').textContent='● 雲端已同步';$('conn').className='text-xs text-green-600'},e=>err('讀取資料失敗',e))}
async function loadPw(){try{const s=await getDoc(settings());pwReady=!!s.data()?.passwordHash}catch(e){err('讀取密碼設定失敗',e)}}
function salt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function hash(p,s,it=ITER){const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(p),{name:'PBKDF2'},false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(s),iterations:it,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function verify(p){const d=(await getDoc(settings())).data()||{};return!!d.passwordHash&&!!d.passwordSalt&&(await hash(p,d.passwordSalt,d.passwordIterations||ITER))===d.passwordHash}
async function savePw(p){const s=salt(),h=await hash(p,s);await setDoc(settings(),{passwordSalt:s,passwordHash:h,passwordIterations:ITER,updatedAt:serverTimestamp()},{merge:true});pwReady=true;unlockUntil=Date.now()+1800000}
const unlocked=()=>Date.now()<unlockUntil;
function showPw(mode){['pwLogin','pwSetup','pwChange'].forEach(x=>$(x).classList.add('hidden'));$('passwordModal').classList.remove('hidden');$('passwordModal').classList.add('flex');if(mode==='setup'||!pwReady){$('pwTitle').textContent='🔒 設定編輯密碼';$('pwHint').textContent='第一次使用請先設定編輯密碼';$('pwSetup').classList.remove('hidden')}else if(mode==='change'){$('pwTitle').textContent='🔑 更改編輯密碼';$('pwHint').textContent='目前密碼已驗證';$('pwChange').classList.remove('hidden')}else{$('pwTitle').textContent='🔒 編輯密碼';$('pwHint').textContent='編輯與刪除需要輸入密碼';$('currentPw').value='';$('pwLogin').classList.remove('hidden');setTimeout(()=>$('currentPw').focus(),50)}}
function closePw(){$('passwordModal').classList.add('hidden');$('passwordModal').classList.remove('flex')}
function renderAddPreview(){$('photoPreview').innerHTML=addFiles.map((f,i)=>`<div class="relative"><img src="${URL.createObjectURL(f)}" class="thumb"><button type="button" onclick="removeAddPhoto(${i})" class="absolute -top-2 -right-2 bg-black/70 text-white rounded-full w-7 h-7">×</button></div>`).join('')}
window.removeAddPhoto=i=>{addFiles.splice(i,1);renderAddPreview()}
function renderEditPreview(){$('editPhotoPreview').innerHTML=editFiles.map((f,i)=>`<div class="relative"><img src="${URL.createObjectURL(f)}" class="thumb"><button type="button" onclick="removeEditPhoto(${i})" class="absolute -top-2 -right-2 bg-black/70 text-white rounded-full w-7 h-7">×</button></div>`).join('')}
window.removeEditPhoto=i=>{editFiles.splice(i,1);renderEditPreview()}
function renderCurrent(){ $('editPhotos').innerHTML=keepPhotos.length?keepPhotos.map((p,i)=>`<div class="relative"><a href="${esc(p.url)}" target="_blank"><img src="${esc(p.url)}" class="thumb"></a><button type="button" onclick="removeCurrentPhoto(${i})" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-7 h-7">×</button></div>`).join(''):'<div class="text-sm text-gray-400">目前沒有照片</div>' }
window.removeCurrentPhoto=i=>{keepPhotos.splice(i,1);renderCurrent()}
async function compress(file){if(!file.type.startsWith('image/'))throw new Error(file.name+' 不是圖片檔');return new Promise((resolve,reject)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,MAXD/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);if(!b)return reject(new Error('照片壓縮失敗'));resolve(new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}))},'image/jpeg',Q)};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('無法讀取照片：'+file.name))};img.src=u})}
async function uploadPhotos(issueId,files){const out=[];for(let i=0;i<files.length;i++){toast(`照片上傳中 ${i+1}/${files.length}`);const f=await compress(files[i]),name=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))+'.jpg',p=`${APP}/issues/${issueId}/${name}`,r=storageRef(storage,p);await uploadBytes(r,f,{contentType:'image/jpeg'});out.push({name:files[i].name,path:p,url:await getDownloadURL(r)})}return out}
async function delPhotos(list){for(const p of list||[]){try{await deleteObject(storageRef(storage,p.path))}catch(e){console.warn(e)}}}
function openEditModal(id){const r=issues.find(x=>x.dbId===id);if(!r)return;$('editDbId').value=id;$('editId').value=r.id||'';$('editDate').value=r.date||'';$('editProduct').value=r.product||'';$('editAssignee').value=r.assignee||'';$('editCategory').value=r.category||'其他';$('editStatus').value=r.status||'待處理';$('editDescription').value=r.description||'';$('editAction').value=r.action||'';$('editTarget').value=r.targetDate||'';$('editRemarks').value=r.remarks||'';keepPhotos=(r.photos||[]).map(x=>({...x}));editFiles=[];renderCurrent();renderEditPreview();$('editModal').classList.remove('hidden');$('editModal').classList.add('flex')}
window.editIssue=id=>{if(unlocked())openEditModal(id);else{pendingEdit=id;showPw('login')}}
async function doDelete(id){if(!confirm('確定要刪除這筆議題及其照片嗎？'))return;try{const r=issues.find(x=>x.dbId===id);await deleteDoc(iref(id));await delPhotos(r?.photos||[]);toast('已刪除議題與照片')}catch(e){err('刪除失敗',e)}}
window.removeIssue=id=>{if(unlocked())doDelete(id);else{pendingEdit='DELETE:'+id;showPw('login')}}
$('photoFiles').onchange=e=>{const f=[...e.target.files];if(addFiles.length+f.length>MAXP)return toast(`最多 ${MAXP} 張照片`,true);addFiles=[...addFiles,...f];renderAddPreview();e.target.value=''};
$('editPhotoFiles').onchange=e=>{const f=[...e.target.files];if(keepPhotos.length+editFiles.length+f.length>MAXP)return toast(`每筆最多 ${MAXP} 張照片`,true);editFiles=[...editFiles,...f];renderEditPreview();e.target.value=''};

async function exportExcel(){try{toast('正在準備 Excel 與照片…');if(!window.ExcelJS){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';s.onload=res;s.onerror=()=>rej(new Error('無法載入 ExcelJS'));document.head.appendChild(s)})}const snap=await getDocs(col()),data=snap.docs.map(d=>({dbId:d.id,...d.data()})).sort((a,b)=>(+a.id||0)-(+b.id||0)),wb=new window.ExcelJS.Workbook(),ws=wb.addWorksheet('產品討論議題');const hs=['序號','提出日期','專案/產品名稱','議題類別','議題說明','負責人員','處理對策與進度','預計完成日期','狀態','備註',...Array.from({length:MAXP},(_,i)=>'照片'+(i+1))];ws.addRow(hs);[8,13,22,10,34,12,34,14,10,26,...Array(MAXP).fill(14)].forEach((w,i)=>ws.getColumn(i+1).width=w);for(const r of data){const photos=(r.photos||[]).slice(0,MAXP),row=ws.addRow([r.id||'',r.date||'',r.product||'',r.category||'',r.description||'',r.assignee||'',r.action||'',r.targetDate||'',r.status||'',r.remarks||'',...Array(MAXP).fill('')]);row.height=95;for(let i=0;i<photos.length;i++){const p=photos[i];try{const resp=await fetch(p.url,{mode:'cors',cache:'no-store'});if(!resp.ok)throw new Error('HTTP '+resp.status);const buf=await resp.arrayBuffer();let bin='';const a=new Uint8Array(buf);for(let j=0;j<a.length;j+=32768)bin+=String.fromCharCode(...a.subarray(j,j+32768));const ct=(resp.headers.get('content-type')||'image/jpeg').split(';')[0],ext=ct.includes('png')?'png':'jpeg',iid=wb.addImage({base64:`data:${ct};base64,${btoa(bin)}`,extension:ext});ws.addImage(iid,{tl:{col:10+i+.08,row:row.number-1+.08},ext:{width:92,height:78},editAs:'oneCell'});row.getCell(11+i).value={text:`照片${i+1}`,hyperlink:p.url}}catch(e){row.getCell(11+i).value={text:'照片連結',hyperlink:p.url}}}}const out=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='產品討論議題履歷表_含照片.xlsx';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast(`Excel 匯出完成：${data.length} 筆`)}catch(e){err('Excel 匯出失敗',e)}}
$('export').onclick=exportExcel;$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async v=>{try{const wb=XLSX.read(new Uint8Array(v.target.result),{type:'array',cellDates:true}),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);if(!rs.length)throw new Error('Excel 沒有資料');const batch=writeBatch(db);rs.forEach(x=>{const q=doc(col()),cv=a=>a instanceof Date?a.toLocaleDateString('en-CA'):String(a??'');batch.set(q,{id:cv(x['序號']),date:cv(x['提出日期']),product:cv(x['專案/產品名稱']),category:cv(x['議題類別'])||'其他',description:cv(x['議題說明']),assignee:cv(x['負責人員']),action:cv(x['處理對策與進度']),targetDate:cv(x['預計完成日期']),status:cv(x['狀態'])||'待處理',remarks:cv(x['備註']),photos:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()})});await batch.commit();toast('Excel 匯入完成')}catch(e){err('匯入失敗',e)}finally{$('file').value=''}};r.readAsArrayBuffer(f)};
