<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="產品議題履歷"><link rel="manifest" href="./manifest.webmanifest"><title>產品討論議題履歷表</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script><style>body{font-family:Inter,'Noto Sans TC',sans-serif;background:#f3f4f6}input,select,button,textarea{font-size:16px}.card{border:1px solid #e5e7eb;border-radius:16px;background:#fff}.modal{background:rgba(0,0,0,.5)}@media(min-width:768px){.mobile-only{display:none}}@media(max-width:767px){.desktop-only{display:none}}button:disabled{opacity:.6}</style></head><body class="text-gray-800 min-h-screen"><div id="toast" class="fixed z-50 left-3 right-3 bottom-4 md:left-auto md:right-5 md:w-[380px] space-y-2"></div><header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b"><div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between"><div><h1 class="text-xl sm:text-2xl font-bold">☑ 產品討論議題履歷表</h1><p class="text-xs text-gray-500 mt-1">雲端永久儲存・跨裝置同步・Excel・手機 PWA</p></div><div class="text-right"><div id="conn" class="text-xs text-gray-500">Firebase 連線中…</div><button id="reload" class="mt-1 text-xs text-blue-600">重新同步</button></div></div></header><main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4"><section class="card p-4 sm:p-5"><div class="flex items-center justify-between mb-3"><h2 class="font-bold text-lg">新增議題</h2><span id="count" class="text-xs text-gray-500">0 筆</span></div><form id="addForm" class="grid grid-cols-1 md:grid-cols-4 gap-3"><div><label class="text-xs font-medium">提出日期</label><input id="date" type="date" required class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs font-medium">專案／產品名稱</label><input id="product" required class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs font-medium">議題類別</label><select id="category" class="w-full border rounded-xl px-3 py-2 mt-1"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label class="text-xs font-medium">負責人員</label><input id="assignee" required class="w-full border rounded-xl px-3 py-2 mt-1"></div><div class="md:col-span-4"><label class="text-xs font-medium">議題說明</label><textarea id="description" required rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div><div class="md:col-span-2"><label class="text-xs font-medium">處理對策與進度</label><textarea id="action" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div><div><label class="text-xs font-medium">預計完成日期</label><input id="targetDate" type="date" class="w-full border rounded-xl px-3 py-2 mt-1"></div><div><label class="text-xs font-medium">狀態</label><select id="status" class="w-full border rounded-xl px-3 py-2 mt-1"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div class="md:col-span-3"><label class="text-xs font-medium">備註</label><textarea id="remarks" rows="2" class="w-full border rounded-xl px-3 py-2 mt-1"></textarea></div><div class="flex items-end"><button id="addBtn" class="w-full bg-blue-600 text-white rounded-xl px-4 py-3 font-bold">＋ 確定新增</button></div></form></section><section class="card p-4 sm:p-5"><div class="flex flex-col sm:flex-row gap-3 justify-between mb-4"><input id="search" placeholder="搜尋產品、議題、負責人、備註…" class="flex-1 border rounded-xl px-3 py-2"><div class="flex gap-2"><select id="filterStatus" class="border rounded-xl px-3 py-2"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已結案</option></select><select id="filterCategory" class="border rounded-xl px-3 py-2"><option value="">全部類別</option><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div></div><div class="desktop-only overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-50"><tr><th class="p-3 text-left">序號</th><th class="p-3 text-left">日期</th><th class="p-3 text-left">專案/產品</th><th class="p-3 text-left">類別</th><th class="p-3 text-left">議題</th><th class="p-3 text-left">負責人</th><th class="p-3 text-left">處理對策與進度</th><th class="p-3 text-left">預計完成</th><th class="p-3 text-left">狀態</th><th class="p-3 text-left">備註</th><th class="p-3">操作</th></tr></thead><tbody id="table"></tbody></table></div><div class="mobile-only space-y-3" id="cards"></div></section><section class="card p-4 flex flex-wrap gap-2"><button id="export" class="bg-green-600 text-white rounded-xl px-4 py-3">匯出 Excel</button><button id="importBtn" class="bg-gray-100 rounded-xl px-4 py-3">匯入 Excel</button><input id="file" type="file" accept=".xlsx,.xls" hidden></section></main><div id="editModal" class="hidden fixed inset-0 modal z-50 p-3 items-center justify-center"><div class="bg-white rounded-2xl w-full max-w-3xl p-5"><div class="flex justify-between mb-4"><h2 class="font-bold text-lg">編輯議題</h2><button id="closeEdit">✕</button></div><form id="editForm" class="grid grid-cols-1 md:grid-cols-2 gap-3"><input id="editDbId" type="hidden"><input id="editId" placeholder="序號" class="border rounded-xl px-3 py-2"><input id="editDate" type="date" class="border rounded-xl px-3 py-2"><input id="editProduct" required placeholder="專案/產品名稱" class="border rounded-xl px-3 py-2"><input id="editAssignee" required placeholder="負責人員" class="border rounded-xl px-3 py-2"><textarea id="editDescription" class="md:col-span-2 border rounded-xl px-3 py-2"></textarea><textarea id="editAction" class="md:col-span-2 border rounded-xl px-3 py-2"></textarea><input id="editTarget" type="date" class="border rounded-xl px-3 py-2"><select id="editStatus" class="border rounded-xl px-3 py-2"><option>待處理</option><option>處理中</option><option>已結案</option></select><input id="editRemarks" class="border rounded-xl px-3 py-2"><select id="editCategory" class="border rounded-xl px-3 py-2"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select><div class="md:col-span-2 flex justify-end gap-2"><button type="button" id="cancelEdit" class="bg-gray-100 rounded-xl px-4 py-2">取消</button><button class="bg-blue-600 text-white rounded-xl px-4 py-2">儲存</button></div></form></div></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';const cfg={apiKey:'AIzaSyCgE9Xj3RWmoDs0gaCbwJbKZ6N7HjFw4tA',authDomain:'vectech-2114d.firebaseapp.com',projectId:'vectech-2114d',storageBucket:'vectech-2114d.firebasestorage.app',messagingSenderId:'1099462295117',appId:'1:1099462295117:web:ce5a0a6ef0749d1f8f2604'},APP='product-issue-tracker-01';let db,issues=[],unsub;const $=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(m,err=false){const d=document.createElement('div');d.className=(err?'bg-red-600':'bg-green-600')+' text-white rounded-xl p-3 shadow';d.textContent=m;$('toast').appendChild(d);setTimeout(()=>d.remove(),5000)}function path(){return['artifacts',APP,'public','data']}function col(){return collection(db,...path(),'issues')}function ref(id){return doc(db,...path(),'issues',id)}function msg(p,e){const c=e?.code||'unknown',m=e?.message||String(e);$('conn').textContent=p+'：'+c;$('conn').className='text-xs text-red-600';toast(p+'：'+c+'｜'+m,true);console.error(p,e)}function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('filterStatus').value,c=$('filterCategory').value;return issues.filter(r=>(!s||r.status===s)&&(!c||r.category===c)&&(!q||[r.id,r.product,r.category,r.assignee,r.description,r.action,r.remarks].join(' ').toLowerCase().includes(q)))}function render(){const rows=filtered();$('count').textContent=`${rows.length}/${issues.length} 筆`;$('table').innerHTML=rows.map(r=>`<tr class="border-t align-top"><td class="p-3">${esc(r.id)}</td><td class="p-3">${esc(r.date)}</td><td class="p-3">${esc(r.product)}</td><td class="p-3">${esc(r.category)}</td><td class="p-3">${esc(r.description)}</td><td class="p-3">${esc(r.assignee)}</td><td class="p-3">${esc(r.action)}</td><td class="p-3">${esc(r.targetDate)}</td><td class="p-3">${esc(r.status)}</td><td class="p-3">${esc(r.remarks)}</td><td class="p-3 whitespace-nowrap"><button class="text-blue-600 mr-2" onclick="editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="removeIssue('${r.dbId}')">刪除</button></td></tr>`).join('');$('cards').innerHTML=rows.map(r=>`<article class="card p-4"><div class="flex justify-between"><div><div class="font-bold">#${esc(r.id)} ${esc(r.product)}</div><div class="text-xs text-gray-500">${esc(r.date)} ・ ${esc(r.category)} ・ ${esc(r.assignee)}</div></div><span class="px-2 py-1 rounded-full text-xs ${r.status==='已結案'?'bg-green-100 text-green-700':r.status==='處理中'?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}">${esc(r.status)}</span></div><div class="mt-3 space-y-2 text-sm"><div><b>議題：</b>${esc(r.description)}</div><div><b>進度：</b>${esc(r.action)||'—'}</div><div><b>預計：</b>${esc(r.targetDate)||'—'}</div><div><b>備註：</b>${esc(r.remarks)||'—'}</div></div><div class="border-t mt-3 pt-3 flex justify-end gap-4"><button class="text-blue-600" onclick="editIssue('${r.dbId}')">編輯</button><button class="text-red-600" onclick="removeIssue('${r.dbId}')">刪除</button></div></article>`).join('')}function subscribe(){if(unsub)unsub();unsub=onSnapshot(col(),s=>{issues=s.docs.map(d=>({dbId:d.id,...d.data()}));issues.sort((a,b)=>(+a.id||0)-(+b.id||0));render();$('conn').textContent='● 雲端已同步';$('conn').className='text-xs text-green-600'},e=>msg('讀取資料失敗',e))}function init(){try{const app=initializeApp(cfg);db=getFirestore(app);$('conn').textContent='Firebase 連線中…';subscribe()}catch(e){msg('Firebase 初始化失敗',e);$('addBtn').disabled=true}}$('addForm').onsubmit=async e=>{e.preventDefault();if(!db)return toast('雲端尚未連線完成',true);const b=$('addBtn');b.disabled=true;b.textContent='寫入雲端中…';try{await addDoc(col(),{id:String(issues.reduce((m,r)=>Math.max(m,+r.id||0),0)+1),date:$('date').value,product:$('product').value.trim(),category:$('category').value,assignee:$('assignee').value.trim(),description:$('description').value.trim(),action:$('action').value.trim(),targetDate:$('targetDate').value,status:$('status').value,remarks:$('remarks').value.trim(),createdAt:serverTimestamp(),updatedAt:serverTimestamp()});e.target.reset();$('date').value=today();toast('新增成功，已永久寫入雲端')}catch(err){msg('新增失敗',err)}finally{b.disabled=false;b.textContent='＋ 確定新增'}};window.removeIssue=async id=>{if(!confirm('確定要刪除這筆議題嗎？'))return;try{await deleteDoc(ref(id));toast('刪除成功')}catch(e){msg('刪除失敗',e)}};window.editIssue=id=>{const r=issues.find(x=>x.dbId===id);if(!r)return;$('editDbId').value=r.dbId;$('editId').value=r.id||'';$('editDate').value=r.date||'';$('editProduct').value=r.product||'';$('editCategory').value=r.category||'其他';$('editAssignee').value=r.assignee||'';$('editStatus').value=r.status||'待處理';$('editDescription').value=r.description||'';$('editAction').value=r.action||'';$('editTarget').value=r.targetDate||'';$('editRemarks').value=r.remarks||'';$('editModal').classList.remove('hidden');$('editModal').classList.add('flex')};$('closeEdit').onclick=$('cancelEdit').onclick=()=>{$('editModal').classList.add('hidden');$('editModal').classList.remove('flex')};$('editForm').onsubmit=async e=>{e.preventDefault();try{await updateDoc(ref($('editDbId').value),{id:$('editId').value,date:$('editDate').value,product:$('editProduct').value.trim(),category:$('editCategory').value,assignee:$('editAssignee').value.trim(),status:$('editStatus').value,description:$('editDescription').value.trim(),action:$('editAction').value.trim(),targetDate:$('editTarget').value,remarks:$('editRemarks').value.trim(),updatedAt:serverTimestamp()});$('editModal').classList.add('hidden');$('editModal').classList.remove('flex');toast('更新成功，已同步雲端')}catch(e){msg('更新失敗',e)}};$('search').oninput=render;$('filterStatus').onchange=render;$('filterCategory').onchange=render;$('reload').onclick=()=>location.reload();$('date').value=today();$('export').onclick=()=>{if(!issues.length)return toast('沒有資料可匯出',true);const d=issues.map(r=>({'序號':r.id,'提出日期':r.date,'專案/產品名稱':r.product,'議題類別':r.category,'議題說明':r.description,'負責人員':r.assignee,'處理對策與進度':r.action,'預計完成日期':r.targetDate,'狀態':r.status,'備註':r.remarks})),w=XLSX.utils.json_to_sheet(d),b=XLSX.utils.book_new();XLSX.utils.book_append_sheet(b,w,'產品討論議題');XLSX.writeFile(b,'產品討論議題履歷表.xlsx')};$('importBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async v=>{try{const wb=XLSX.read(new Uint8Array(v.target.result),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);if(!rows.length)throw new Error('Excel 沒有資料');const batch=writeBatch(db);rows.forEach(x=>{const q=doc(col()),cv=a=>a instanceof Date?a.toLocaleDateString('en-CA'):String(a??'');batch.set(q,{id:cv(x['序號']),date:cv(x['提出日期']),product:cv(x['專案/產品名稱']),category:cv(x['議題類別'])||'其他',description:cv(x['議題說明']),assignee:cv(x['負責人員']),action:cv(x['處理對策與進度']),targetDate:cv(x['預計完成日期']),status:cv(x['狀態'])||'待處理',remarks:cv(x['備註']),createdAt:serverTimestamp(),updatedAt:serverTimestamp()})});await batch.commit();toast('Excel 匯入完成，已寫入雲端')}catch(x){msg('匯入失敗',x)}finally{$('file').value=''}};r.readAsArrayBuffer(f)};init();</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error)</script></body></html>
