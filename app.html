<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f3f4f6;color:#172033}header{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 8px #0001;padding:12px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:#64748b;margin-top:3px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0000000c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wide{grid-column:span 4}.half{grid-column:span 2}label{font-size:12px;color:#475569;display:block;margin-bottom:4px}input,select,textarea,button{font:inherit;font-size:16px}input,select,textarea{width:100%;border:1px solid #d8dee9;border-radius:11px;padding:10px;background:#fff}textarea{min-height:82px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#eef2f7}.red{background:#fee2e2;color:#b91c1c}.link{background:none;color:#2563eb;padding:3px 0;font-weight:700}.status{font-size:12px;padding:4px 8px;border-radius:999px;background:#e2e8f0;display:inline-block}.ok{color:#15803d}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.cards{display:none}.issue{border:1px solid #e2e8f0;border-radius:14px;padding:13px;margin:10px 0}.issue h3{margin:0 0 5px}.muted{color:#64748b;font-size:12px}.desc{white-space:pre-wrap;line-height:1.55}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{background:#f8fafc}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.on{display:flex}.dialog{background:#fff;border-radius:18px;padding:18px;width:min(760px,100%);max-height:92vh;overflow:auto}.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{width:86px;height:70px;object-fit:cover;border-radius:9px;border:1px solid #ddd}.small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide,.half{grid-column:span 1}.tablewrap{display:none}.cards{display:block}.title{font-size:18px}.top button{font-size:12px;padding:7px}.card{padding:13px}.toolbar>*{flex:1}.toolbar button{min-width:110px}}

<body>
<header><div class="wrap top"><div><div class="title">☑ 產品討論議題履歷表</div><div class="sub">雲端永久儲存・跨裝置同步・手機 PWA</div></div><div style="text-align:right"><div id="conn" class="small">☁ 連線中…</div><button id="pwBtn" class="link">🔒 編輯密碼</button></div></div></header>
<main class="wrap">
<section class="card"><div class="top"><h2 style="margin:0">新增議題</h2><span id="count" class="muted">0 筆</span></div>
<form id="addForm" class="grid" style="margin-top:12px"><div><label>提出日期</label><input id="date" type="date" required></div><div><label>專案／產品名稱</label><input id="product" required></div><div><label>議題類別</label><select id="category"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label>負責人員</label><input id="assignee" required></div><div class="wide"><label>議題說明</label><textarea id="description" required></textarea></div><div class="half"><label>處理對策與進度</label><textarea id="action"></textarea></div><div><label>預計完成日期</label><input id="target" type="date"></div><div><label>狀態</label><select id="status"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div class="wide"><label>備註</label><textarea id="remarks"></textarea></div><div class="wide"><label>照片／影片（可多個）</label><input id="media" type="file" accept="image/*,video/*" multiple><div id="preview" class="thumbs"></div><div class="muted">照片／影片會嘗試上傳 Firebase Storage；若 Storage 尚未開放，仍可正常儲存文字資料。</div></div><div class="wide"><button class="primary" id="addBtn">＋ 確定新增</button></div></form></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="搜尋產品、議題、負責人、備註…" style="flex:1"><select id="fs" style="max-width:150px"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已結案</option></select><select id="fc" style="max-width:150px"><option value="">全部類別</option><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div class="tablewrap"><table><thead><tr><th>序號</th><th>日期</th><th>專案/產品</th><th>類別</th><th>議題</th><th>負責人</th><th>處理進度</th><th>完成日</th><th>狀態</th><th>操作</th></tr></thead><tbody id="table"></tbody></table></div><div id="cards" class="cards"></div></section>
<section class="card toolbar"><button id="export" class="green">⬇ 匯出 Excel</button><button id="import" class="gray">⬆ 匯入 Excel</button><input id="xlsx" type="file" accept=".xlsx,.xls" hidden><button id="sync" class="gray">↻ 重新同步</button></section></main>
<div id="modal" class="modal"><div class="dialog"><div class="top"><h2 id="modalTitle" style="margin:0">編輯議題</h2><button id="close" class="gray">✕</button></div><form id="editForm" class="grid" style="margin-top:12px"><input id="eid" type="hidden"><input id="dbid" type="hidden"><div><label>提出日期</label><input id="edate" type="date"></div><div><label>專案／產品</label><input id="eproduct"></div><div><label>類別</label><select id="ecategory"><option>機構</option><option>硬體</option><option>軟體</option><option>外觀</option><option>其他</option></select></div><div><label>負責人員</label><input id="eassignee"></div><div class="wide"><label>議題說明</label><textarea id="edescription"></textarea></div><div class="half"><label>處理對策與進度</label><textarea id="eaction"></textarea></div><div><label>預計完成日期</label><input id="etarget" type="date"></div><div><label>狀態</label><select id="estatus"><option>待處理</option><option>處理中</option><option>已結案</option></select></div><div class="wide"><label>備註</label><textarea id="eremarks"></textarea></div><div class="wide"><b>目前附件</b><div id="existing" class="thumbs"></div></div><div class="wide"><label>新增照片／影片</label><input id="emedia" type="file" accept="image/*,video/*" multiple><div id="epreview" class="thumbs"></div></div><div class="wide actions"><button type="button" id="delete" class="red">刪除此議題</button><span style="flex:1"></span><button type="button" id="cancel" class="gray">取消</button><button class="primary">儲存修改</button></div></form></div></div>
<div id="pwModal" class="modal"><div class="dialog" style="max-width:430px"><div class="top"><h2 style="margin:0">🔒 編輯密碼</h2><button id="pwClose" class="gray">✕</button></div><p id="pwText" class="muted"></p><div id="pwBox"></div></div></div><div id="toast" style="position:fixed;left:12px;right:12px;bottom:14px;z-index:100"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";import{getAuth,signInAnonymously,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";import{getFirestore,collection,doc,onSnapshot,addDoc,updateDoc,deleteDoc,getDoc,setDoc,query,orderBy,writeBatch}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL,deleteObject}from"https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";
const cfg={apiKey:"AIzaSyCgE9Xj3RWmoDs0gaCbwJbKZ6N7HjFw4tA",authDomain:"vectech-2114d.firebaseapp.com",projectId:"vectech-2114d",storageBucket:"vectech-2114d.firebasestorage.app",messagingSenderId:"1099462295117",appId:"1:1099462295117:web:ce5a0a6ef0749d1f8f2604"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);const BASE=["artifacts","product-issue-tracker-01","public","data"],issuesCol=collection(db,...BASE,"issues"),settingsRef=doc(db,...BASE,"config","settings");let rows=[],uid="",files=[],editFiles=[],editRow=null,unsub=null,unlocked=false;const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("date").value=new Date().toLocaleDateString("en-CA");
function toast(s,bad=false){const x=document.createElement("div");x.textContent=s;x.style.cssText=`background:${bad?"#dc2626":"#16a34a"};color:white;padding:11px 14px;border-radius:12px;margin-top:8px;box-shadow:0 3px 12px #0003`;$('toast').append(x);setTimeout(()=>x.remove(),5000)}function showConn(t,ok=false){$("conn").textContent=(ok?"● ":"")+t;$("conn").className="small "+(ok?"ok":"")}function mediaHtml(a){return(a||[]).map(x=>x.type?.startsWith("video")?`<video class="thumb" controls src="${esc(x.url)}"></video>`:`<img class="thumb" src="${esc(x.url)}" loading="lazy">`).join("")}function formData(){return{date:$("date").value,product:$("product").value.trim(),category:$("category").value,assignee:$("assignee").value.trim(),description:$("description").value.trim(),action:$("action").value.trim(),target:$("target").value,status:$("status").value,remarks:$("remarks").value.trim()}}function matches(r){const q=$("search").value.trim().toLowerCase();return(!q||Object.values(r).some(v=>typeof v==="string"&&v.toLowerCase().includes(q)))&&(!$("fs").value||r.status===$("fs").value)&&(!$("fc").value||r.category===$("fc").value)}
function render(){const a=rows.filter(matches);$("count").textContent=`${rows.length} 筆`;$('table').innerHTML=a.map((r,i)=>`<tr><td>${esc(r.no??i+1)}</td><td>${esc(r.date)}</td><td><b>${esc(r.product)}</b></td><td>${esc(r.category)}</td><td><div class="desc">${esc(r.description)}</div><button class="link quick" data-id="${r._id}">✎ 修改議題說明（免密碼）</button></td><td>${esc(r.assignee)}</td><td>${esc(r.action)}</td><td>${esc(r.target)}</td><td><span class="status">${esc(r.status)}</span></td><td><button class="link edit" data-id="${r._id}">✎ 完整編輯</button></td></tr>`).join("");$("cards").innerHTML=a.map(r=>`<article class="issue"><h3>#${esc(r.no)}　${esc(r.product)}</h3><div class="muted">${esc(r.date)}　${esc(r.category)}　負責：${esc(r.assignee)}</div><p class="desc"><b>議題：</b>${esc(r.description)}</p><p class="desc"><b>進度：</b>${esc(r.action||"—")}</p><div>${mediaHtml(r.media)}</div><div class="actions"><button class="link quick" data-id="${r._id}">✎ 修改議題說明（免密碼）</button><button class="link edit" data-id="${r._id}">🔒 完整編輯</button></div></article>`).join("");document.querySelectorAll(".quick").forEach(b=>b.onclick=()=>quick(b.dataset.id));document.querySelectorAll(".edit").forEach(b=>b.onclick=()=>fullEdit(b.dataset.id))}
function quick(id){const r=rows.find(x=>x._id===id);if(!r)return;const v=prompt("修改議題說明：",r.description||"");if(v===null)return;updateDoc(doc(db,...BASE,"issues",id),{description:v,updatedAt:Date.now()}).then(()=>toast("議題說明已更新")).catch(e=>toast("修改失敗："+e.message,true))}async function hash(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function passwordSetup(){const snap=await getDoc(settingsRef);if(!snap.exists()||!snap.data().passwordHash){$("pwText").textContent="第一次使用，請設定編輯密碼。";$("pwBox").innerHTML='<input id="p1" type="password" placeholder="新密碼（至少4碼）"><input id="p2" type="password" placeholder="再次輸入" style="margin-top:8px"><button id="psave" class="primary" style="width:100%;margin-top:8px">設定密碼</button>';$('psave').onclick=async()=>{if($('p1').value.length<4||$('p1').value!==$('p2').value)return toast("兩次密碼不一致或少於4碼",true);await setDoc(settingsRef,{passwordHash:await hash($('p1').value)},{merge:true});unlocked=true;$('pwModal').classList.remove('on');toast("編輯密碼已設定")}}else{$('pwText').textContent="輸入編輯密碼後即可完整編輯／刪除。";$('pwBox').innerHTML='<input id="pin" type="password" placeholder="編輯密碼"><button id="punlock" class="primary" style="width:100%;margin-top:8px">解鎖</button>';$('punlock').onclick=async()=>{const s=await getDoc(settingsRef);if((await hash($('pin').value))===s.data().passwordHash){unlocked=true;$('pwModal').classList.remove('on');toast("已解鎖")}else toast("密碼錯誤",true)}}$('pwModal').classList.add('on')}
$('pwBtn').onclick=passwordSetup;$('pwClose').onclick=()=>$('pwModal').classList.remove('on');async function fullEdit(id){if(!unlocked){toast("請先按右上角「編輯密碼」解鎖",true);return}editRow=rows.find(x=>x._id===id);if(!editRow)return;for(const[k,v]of Object.entries({eid:editRow.no,dbid:id,edate:editRow.date,eproduct:editRow.product,eassignee:editRow.assignee,edescription:editRow.description,eaction:editRow.action,etarget:editRow.target,eremarks:editRow.remarks}))$(k).value=v||"";$('ecategory').value=editRow.category||"機構";$('estatus').value=editRow.status||"待處理";$('existing').innerHTML=mediaHtml(editRow.media);editFiles=[];$('emedia').value="";$('epreview').innerHTML="";$('modal').classList.add('on')}
$('close').onclick=$('cancel').onclick=()=>$('modal').classList.remove('on');$('media').onchange=e=>{files=[...e.target.files];$('preview').innerHTML=files.map(f=>f.type.startsWith('video')?`<span class="muted">${esc(f.name)}</span>`:`<img class="thumb" src="${URL.createObjectURL(f)}">`).join('')};$('emedia').onchange=e=>{editFiles=[...e.target.files];$('epreview').innerHTML=editFiles.map(f=>f.type.startsWith('video')?`<span class="muted">${esc(f.name)}</span>`:`<img class="thumb" src="${URL.createObjectURL(f)}">`).join('')};async function uploadMedia(list,id){const out=[];for(const f of list){const r=ref(storage,`product-issue-tracker/${id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`);await uploadBytes(r,f);out.push({name:f.name,type:f.type,url:await getDownloadURL(r),path:r.fullPath})}return out}
$('addForm').onsubmit=async e=>{e.preventDefault();if(!uid)return toast('雲端尚未登入，請稍候',true);$('addBtn').disabled=true;try{const data=formData();const d=await addDoc(issuesCol,{...data,no:Date.now(),media:[],createdAt:Date.now(),updatedAt:Date.now()});if(files.length){try{const media=await uploadMedia(files,d.id);await updateDoc(d,{media,updatedAt:Date.now()})}catch(x){toast('資料已新增，但附件上傳失敗：請檢查 Firebase Storage 規則',true)}}$('addForm').reset();$('date').value=new Date().toLocaleDateString('en-CA');files=[];$('preview').innerHTML='';toast('新增成功，已同步雲端')}catch(x){toast('新增失敗：'+x.message,true)}finally{$('addBtn').disabled=false}};
$('editForm').onsubmit=async e=>{e.preventDefault();if(!editRow)return;try{let media=editRow.media||[];if(editFiles.length){try{media=media.concat(await uploadMedia(editFiles,editRow._id))}catch(x){toast('文字可儲存，但新附件上傳失敗',true)}}await updateDoc(doc(db,...BASE,'issues',editRow._id),{no:Number($('eid').value)||editRow.no,date:$('edate').value,product:$('eproduct').value.trim(),category:$('ecategory').value,assignee:$('eassignee').value.trim(),description:$('edescription').value.trim(),action:$('eaction').value.trim(),target:$('etarget').value,status:$('estatus').value,remarks:$('eremarks').value.trim(),media,updatedAt:Date.now()});$('modal').classList.remove('on');toast('修改已儲存')}catch(x){toast('儲存失敗：'+x.message,true)}};
$('delete').onclick=async()=>{if(!editRow||!confirm('確定刪除這筆議題？'))return;try{for(const m of(editRow.media||[])){if(m.path){try{await deleteObject(ref(storage,m.path))}catch(_){}}}await deleteDoc(doc(db,...BASE,'issues',editRow._id));$('modal').classList.remove('on');toast('已刪除')}catch(x){toast('刪除失敗：'+x.message,true)}};
$('export').onclick=()=>{const data=rows.map(r=>({序號:r.no,提出日期:r.date,專案_產品名稱:r.product,議題類別:r.category,議題說明:r.description,負責人員:r.assignee,處理對策與進度:r.action,預計完成日期:r.target,狀態:r.status,備註:r.remarks,附件:(r.media||[]).map(x=>x.url).join('\n')}));const ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'產品議題');XLSX.writeFile(wb,'產品討論議題履歷表.xlsx')};$('import').onclick=()=>$('xlsx').click();$('xlsx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);const b=writeBatch(db);data.forEach(r=>b.set(doc(issuesCol),{no:r.序號||Date.now(),date:r.提出日期||'',product:r.專案_產品名稱||'',category:r.議題類別||'其他',description:r.議題說明||'',assignee:r.負責人員||'',action:r.處理對策與進度||'',target:r.預計完成日期||'',status:r.狀態||'待處理',remarks:r.備註||'',media:[],createdAt:Date.now(),updatedAt:Date.now()}));await b.commit();toast(`已匯入 ${data.length} 筆`)}catch(x){toast('匯入失敗：'+x.message,true)}e.target.value=''};$('sync').onclick=()=>location.reload();['search','fs','fc'].forEach(id=>$(id).oninput=render);
onAuthStateChanged(auth,u=>{if(u){uid=u.uid;showConn('雲端已同步',true);if(!unsub)unsub=onSnapshot(query(issuesCol,orderBy('createdAt','desc')),s=>{rows=s.docs.map(d=>({_id:d.id,...d.data()}));render()},e=>{showConn('雲端讀取失敗');toast('Firestore 讀取失敗：'+e.message,true)})}});signInAnonymously(auth).catch(e=>{showConn('登入失敗');toast('Firebase 登入失敗：'+e.message,true)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=12').catch(()=>{});
</script></body></html>
